
# Local infrastructure for the simulator.
#
# Nothing here is required for `mvn verify`: the domain core has no dependencies at all,
# and the integration tests use Testcontainers, which starts its own throwaway instances.
# This file is for running the services by hand.

services:
  postgres:
    image: postgres:17-alpine
    container_name: revshare-postgres
    environment:
      POSTGRES_DB: revshare
      POSTGRES_USER: revshare
      POSTGRES_PASSWORD: revshare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revshare -d revshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The CQRS read store. Holds the denormalized agent dashboard: cap progress, the
  # downline tree, and revenue share earnings, projected from the event stream.
  mongodb:
    image: mongo:8
    container_name: revshare-mongodb
    environment:
      MONGO_INITDB_DATABASE: revshare_read
    # Single node, but a replica set all the same. Mongo offers no multi-document transactions
    # on a standalone server, and reporting-service needs them: it marks an event processed and
    # folds it into up to five dashboards, and those have to commit together or the read model
    # double-counts on the next redelivery. Testcontainers' MongoDBContainer does the same thing
    # for the integration tests, so development and test agree.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Initiates the set on the first check, then reports health on every one after. Doing it
    # here rather than in a separate init container keeps `docker compose up -d` a single
    # command that produces a usable database.
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # KRaft mode, so there is no ZooKeeper to run alongside it.
  kafka:
    # Kept in step with AbstractKafkaIT so the development broker and the test broker are the
    # same release. 3.9.0 is avoided there because it cannot start under Testcontainers at all;
    # see that class for the detail.
    image: apache/kafka:3.9.2
    container_name: revshare-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker development cluster: replication beyond one node is impossible.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  mongo-data:
