spring:
  application:
    name: commission-service

  aop:
    # Proxy services through their interface with a JDK dynamic proxy, rather than by
    # subclassing them with CGLIB.
    #
    # This has to be set explicitly. Spring Boot defaults it to true, which forces class-based
    # proxying whether or not a bean implements an interface — so declaring an interface is
    # necessary but on its own changes nothing. Verified: before this line, both services came
    # back as ...$$SpringCGLIB$$0 despite both implementing interfaces.
    #
    # CGLIB proxies subclass the target, so they silently fail to advise a final class or a
    # final method, and generate a class at runtime per proxied type. JDK proxies have neither
    # problem, and because a JDK proxy cannot be cast to the implementation, "depend on the
    # interface" becomes structural rather than aspirational.
    #
    # ProxyStrategyIT asserts the outcome, so this cannot silently regress.
    proxy-target-class: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/revshare}
    username: ${DB_USERNAME:revshare}
    password: ${DB_PASSWORD:revshare}
    hikari:
      # Sized for a write path that holds a connection only for the length of one closing.
      # The usual mistake is a large pool: connections are a Postgres-side resource, and
      # beyond roughly (cores * 2) + effective_spindles the throughput gain is nil while
      # lock contention and memory per backend keep climbing.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      # Fail fast rather than queueing behind an exhausted pool. A closing that cannot get
      # a connection in 5s is better retried by the caller than held open.
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # Never generate schema. Liquibase owns it, and having Hibernate also express an
      # opinion is how the two silently diverge.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Batches the five revenue share awards a closing produces into one round trip
          # rather than five. order_inserts is required for the batching to actually
          # engage across entity types.
          batch_size: 32
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    com.revshare: INFO

---
spring:
  config:
    activate:
      on-profile: local-verbose
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    # Turned on by profile rather than by default: useful when checking that an index is
    # actually being used, far too noisy otherwise.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
