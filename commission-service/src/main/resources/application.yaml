spring:
  application:
    name: commission-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/revshare}
    username: ${DB_USERNAME:revshare}
    password: ${DB_PASSWORD:revshare}
    hikari:
      # Sized for a write path that holds a connection only for the length of one closing.
      # The usual mistake is a large pool: connections are a Postgres-side resource, and
      # beyond roughly (cores * 2) + effective_spindles the throughput gain is nil while
      # lock contention and memory per backend keep climbing.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      # Fail fast rather than queueing behind an exhausted pool. A closing that cannot get
      # a connection in 5s is better retried by the caller than held open.
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # Never generate schema. Liquibase owns it, and having Hibernate also express an
      # opinion is how the two silently diverge.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Batches the five revenue share awards a closing produces into one round trip
          # rather than five. order_inserts is required for the batching to actually
          # engage across entity types.
          batch_size: 32
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # The outbox payload is already a JSON string, so it goes out as-is rather than being
      # serialized a second time.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for all in-sync replicas. Anything weaker means an acknowledged event can be lost
      # on a broker failure, and the relay would have already marked the row published.
      acks: all
      properties:
        # Deduplicates producer-side retries and preserves per-partition ordering across them.
        # Without it, a retry after a timeout can both duplicate a record and reorder it behind
        # the next one.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000

revshare:
  outbox:
    # Latency versus load. Events are already durable, so a slower poll only delays the read
    # side; it never risks losing anything.
    poll-interval-ms: 500
    initial-delay-ms: 1000
    batch-size: 100
  kafka:
    partitions: 3
    replicas: 1

logging:
  level:
    com.revshare: INFO

---
spring:
  config:
    activate:
      on-profile: local-verbose
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    # Turned on by profile rather than by default: useful when checking that an index is
    # actually being used, far too noisy otherwise.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
